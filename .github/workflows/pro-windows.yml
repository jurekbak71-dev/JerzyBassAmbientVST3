name: Build Jerzy Bass Ambient PRO (Windows)
on:
  workflow_dispatch:
  push:
    branches: [pro/composer-arranger]
    paths: ['PRO/**', '.github/workflows/pro-windows.yml']
permissions:
  contents: write
concurrency:
  group: windows-pro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure PRO
        run: cmake -S PRO -B build-pro -G "Visual Studio 17 2022" -A x64 -DPRO_ENABLE_LTO=OFF
      - name: Build Windows Standalone and VST3
        run: cmake --build build-pro --config Release --parallel 2
      - name: Test PRO
        shell: pwsh
        run: |
          ctest --test-dir build-pro -C Release --output-on-failure
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Get-Content 'build-pro/Testing/Temporary/LastTest.log' | Where-Object { $_ -match 'FAIL:|Test Failed|Exception|Error|failed' } | ForEach-Object {
              $message = $_.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Native CTest::$message"
            }
          }
          exit $testExit
      - name: Package Windows delivery
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'pro-delivery'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item 'build-pro/JerzyBassAmbientPRO_artefacts/Release/Standalone/Jerzy Bass Ambient PRO.exe' $dest
          Compress-Archive -Path 'build-pro/JerzyBassAmbientPRO_artefacts/Release/VST3/Jerzy Bass Ambient PRO.vst3' -DestinationPath "$dest/Jerzy-Bass-Ambient-PRO-VST3-Windows.zip"
          Copy-Item 'PRO/docs/START_PL.md' "$dest/START-PL.md"
          Copy-Item 'PRO/docs/LIVE_PL.md' "$dest/LIVE-PL.md"
          Copy-Item 'PRO/docs/PERFORMANCE.md' "$dest/PERFORMANCE.md"
          Copy-Item 'PRO/docs/VISUAL_LANGUAGE.md' "$dest/VISUAL_LANGUAGE.md"
          Copy-Item 'PRO/docs/COMPOSER.md' "$dest/COMPOSER.md"
          Copy-Item 'PRO/README.md' "$dest/README.md"
          "source_commit=$env:GITHUB_SHA`nplatform=Windows-x64-MSVC`ntests=CTest-all-passed`ncreated_utc=$([DateTime]::UtcNow.ToString('o'))" | Set-Content "$dest/BUILD.txt"
          $preview = Join-Path $env:RUNNER_TEMP 'pro-gui-preview'
          New-Item -ItemType Directory -Force $preview | Out-Null
          $screens = Get-ChildItem 'build-pro' -Filter 'gui-*.png' | Where-Object { $_.Name -match '^gui-\d{2}-' } | Sort-Object Name
          if ($screens.Count -ne 22) { throw "Expected 22 compiled GUI screenshots, got $($screens.Count)" }
          $screens | Copy-Item -Destination $preview
          $html = '<!doctype html><html lang="pl"><meta charset="utf-8"><title>PRO 0.8 — GUI</title><style>body{background:#111923;color:#eee;font:16px sans-serif;max-width:1240px;margin:auto;padding:24px}img{max-width:100%;border:1px solid #405565}figure{margin:32px 0}a{color:#63dbd0}</style><h1>Jerzy Bass Ambient PRO 0.8</h1><p>Rzeczywiste zrzuty skompilowanego interfejsu JUCE na Windows, wykonane przez test hosta. Zrzuty nie przedstawiają sesji FL Studio.</p>'
          foreach ($screen in $screens) { $html += "<figure><figcaption>$($screen.BaseName)</figcaption><a href='$($screen.Name)'><img src='$($screen.Name)'></a></figure>" }
          $html += '</html>'
          $html | Set-Content -Encoding utf8 "$preview/index.html"
          Compress-Archive -Path "$preview/*" -DestinationPath "$dest/GUI-PRO-0.8-real-screenshots.zip"
          $bundle = Join-Path $env:RUNNER_TEMP 'Jerzy-Bass-Ambient-PRO-0.8-Windows-x64.zip'
          Compress-Archive -Path "$dest/*" -DestinationPath $bundle
          Move-Item $bundle $dest
          Get-ChildItem $dest -File | Where-Object { $_.Extension -in '.exe','.zip' } | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content "$dest/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Jerzy-Bass-Ambient-PRO-Windows-x64
          path: ${{ runner.temp }}/pro-delivery/
          if-no-files-found: error
      - name: Save tested binaries to the dedicated delivery branch
        shell: pwsh
        run: |
          $ref = 'windows/pro-0.8'
          $remote = git ls-remote origin "refs/heads/$ref"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect delivery branch' }
          if ($remote) {
            git fetch origin $ref
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch delivery history' }
            git checkout --detach FETCH_HEAD
          } else {
            git checkout --orphan windows-delivery
            git rm -rf --cached .
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare delivery checkout' }
          New-Item -ItemType Directory -Force delivery | Out-Null
          Copy-Item "$env:RUNNER_TEMP/pro-delivery/*" delivery/ -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f delivery/
          git commit -m "Windows PRO build $env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit delivery' }
          git push origin "HEAD:refs/heads/$ref"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish delivery branch' }
