<button class=\"active\" >W\u0141\u0104CZONY</button><div style=\"height:12px\"></div><div class=\"knobs\"><div class=\"control\"><label>Return</label><svg class=\"knob\" viewBox=\"0 0 64 64\"><circle cx=\"32\" cy=\"32\" r=\"28\" fill=\"none\" stroke=\"#455665\" stroke-width=\"2\" stroke-dasharray=\"2 5\"/><circle cx=\"32\" cy=\"32\" r=\"22\" fill=\"#111a23\" stroke=\"#61717c\" stroke-width=\"1\"/><circle cx=\"32\" cy=\"32\" r=\"18\" fill=\"#35424c\" stroke=\"#778993\" stroke-width=\"1\"/><path d=\"M32 32 L32 16\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-linecap=\"round\" transform=\"rotate(-20 32 32)\"/></svg><output>\u22128 dB</output></div><div class=\"control\"><label>Room size</label><svg class=\"knob\" viewBox=\"0 0 64 64\"><circle cx=\"32\" cy=\"32\" r=\"28\" fill=\"none\" stroke=\"#455665\" stroke-width=\"2\" stroke-dasharray=\"2 5\"/><circle cx=\"32\" cy=\"32\" r=\"22\" fill=\"#111a23\" stroke=\"#61717c\" stroke-width=\"1\"/><circle cx=\"32\" cy=\"32\" r=\"18\" fill=\"#35424c\" stroke=\"#778993\" stroke-width=\"1\"/><path d=\"M32 32 L32 16\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-linecap=\"round\" transform=\"rotate(55 32 32)\"/></svg><output>70%</output></div></div></section></div><p class=\"note\">Wysy\u0142ki s\u0105 po faderze i Mute. Poziom wysy\u0142ki ustawiasz na pasku instrumentu.</p><div class=\"modalfoot\"><span class=\"note\">Podgl\u0105d ustawie\u0144 \u00b7 propozycja do akceptacji</span><div class=\"spacer\"></div><button class=\"active\" onclick=\"go('mixer')\">ZAMKNIJ</button></div></div></div>", "settings": "<div class=\"modalback\"><div class=\"modal\"><h2>Ustawienia</h2><div class=\"sub\">Rzadziej u\u017cywane opcje poza g\u0142\u00f3wnym ekranem</div><div class=\"modalgrid\"><div class=\"field\"><label>\u0179r\u00f3d\u0142o zegara</label><select><option>Automatycznie: FL w VST3 / Internal w EXE</option><option>HOST / FL Studio</option><option>Internal</option><option>MIDI Clock</option></select></div><div class=\"field\"><label>Tempo wewn\u0119trzne</label><input value=\"113 BPM\"></div><div class=\"field\"><label>Rozmiar interfejsu</label><select><option>Dopasuj do ekranu</option><option>100%</option><option>85%</option><option>75%</option></select></div><div class=\"field\"><label>Metrum</label><select><option>Z hosta</option><option>4/4</option><option>3/4</option><option>7/8</option></select></div></div><div class=\"separator\"></div><div class=\"row\"><button class=\"\" >MIDI LEARN</button><button class=\"\" >RESET PRZYPISA\u0143</button><span class=\"note\">Prawy klik: warto\u015b\u0107 domy\u015blna</span></div><p class=\"note\">W VST3 aktywne tempo hosta jest widoczne w nag\u0142\u00f3wku. Gdy host jest \u017ar\u00f3d\u0142em zegara, pole Internal BPM nie steruje odtwarzaniem.</p><div class=\"modalfoot\"><span class=\"note\">Podgl\u0105d ustawie\u0144 \u00b7 propozycja do akceptacji</span><div class=\"spacer\"></div><button class=\"active\" onclick=\"go('mixer')\">ZAPISZ I ZAMKNIJ</button></div></div></div>", "diagnostics": "<div class=\"modalback\"><div class=\"modal\"><h2>Diagnostyka sygna\u0142u</h2><div class=\"sub\">Szczeg\u00f3\u0142y po klikni\u0119ciu \u00b7 nie zajmuj\u0105 stale ekranu</div><div class=\"grid2\"><section class=\"panel\" ><div class=\"panel-title\">WEJ\u015aCIE</div><div class=\"note\"><span class=\"led\"></span>MIDI: kana\u0142 1 \u00b7 C3 \u00b7 velocity 100<br><span class=\"led\"></span>Zegar: HOST \u00b7 113 BPM \u00b7 PLAY<br><span class=\"led\"></span>\u0179r\u00f3d\u0142o gry: MIDI<br><span class=\"led\"></span>Bas: generator Rock</div></section><section class=\"panel\" ><div class=\"panel-title\">WYJ\u015aCIE</div><div class=\"note\"><span class=\"led\"></span>Modu\u0142 BASS: aktywny<br><span class=\"led\"></span>Mute: nie \u00b7 Solo: nie<br><span class=\"led\"></span>Wyj\u015bcie: MAIN<br><span class=\"led\"></span>Poziom: \u221212.4 dBFS</div></section></div><div class=\"success\">Tor sygna\u0142u dzia\u0142a. W razie ciszy tutaj pojawi si\u0119 konkretna przyczyna: brak nut, zatrzymany zegar, wy\u0142\u0105czony modu\u0142 lub routing.</div><div class=\"modalfoot\"><span class=\"note\">Podgl\u0105d ustawie\u0144 \u00b7 propozycja do akceptacji</span><div class=\"spacer\"></div><button class=\"active\" onclick=\"go('mixer')\">ZAMKNIJ</button></div></div></div>"};
function go(view){location.hash=view;render()}
function toggleGroup(el){el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function selectScene(el){el.parentElement.querySelectorAll('.scene-item').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function render(){let key=location.hash.slice(1)||'bass';if(!views[key])key='bass';const [module,content]=views[key];const mainview=module==='arranger'?'arranger':module==='mixer'?'mixer':'instruments';let sidebar=Object.keys(colors).map(m=>`<div class="module ${module===m?'selected':''}" style="--color:${colors[m]}" onclick="go('${m}')"><button class="power" title="Zasilanie modułu" onclick="event.stopPropagation();this.style.opacity=this.style.opacity==='0.2'?'1':'0.2'"></button><b>${names[m]}</b><div class="meter-mini"><i style="height:5px"></i><i style="height:13px"></i><i style="height:9px"></i></div></div>`).join('');let source=module==='arranger'?'ARANŻER':module==='jam'?'JAM':'MIDI';document.getElementById('app').innerHTML=`<div class="app"><div class="top"><div class="brand">JERZY BASS AMBIENT <span style="color:#63dbd0">PRO</span><small>MODULAR GENERATIVE GROOVEBOX</small></div><select class="preset"><option>Rock • Warm Foundation</option><option>Ambient • Lush Motion</option><option>Blues • Walking Bass</option></select><span class="caption" style="font-size:9px;color:#8ca0b4">ŹRÓDŁO GRY</span><select onchange="if(this.value==='JAM')go('jam');if(this.value==='ARANŻER')go('arranger')"><option>${source}</option>${['MIDI','JAM','ARANŻER'].filter(x=>x!==source).map(x=>'<option>'+x+'</option>').join('')}</select><span class="pill">${source==='JAM'?'INTERNAL':'HOST / FL'} · 113 BPM</span><div class="spacer"></div><button class="play" onclick="this.textContent=this.textContent.includes('PLAY')?'Ⅱ PAUZA':'PLAY'">PLAY</button><button>■</button><button title="Zatrzymaj wszystkie dźwięki">PANIC</button></div><div class="bar"><div class="nav"><button class="${mainview==='instruments'?'active':''}" onclick="go('bass')">INSTRUMENTY</button><button class="${mainview==='arranger'?'active':''}" onclick="go('arranger')">ARANŻER</button><button class="${mainview==='mixer'?'active':''}" onclick="go('mixer')">MIKSER</button></div><span class="caption">ROOT / SKALA</span><span class="pill">C · MINOR</span><span class="caption">${source==='MIDI'?'Root z MIDI · kanały 1 / 2 / 3 / 4 / 10':source==='ARANŻER'?'Harmonia ze sceny · Cm / Ab / Fm / G':'Wspólna harmonia · progresja 4 akordów'}</span><div class="spacer"></div><button onclick="go('export-audio')">EKSPORT</button><button title="Ustawienia" onclick="go('settings')">USTAWIENIA</button></div><div class="main">${mainview==='instruments'?`<aside class="sidebar"><div class="side-title">MODUŁY · POWER</div>${sidebar}<div class="side-bottom">● Wejście MIDI<br>▤ Wyjście audio<div class="separator"></div>Głośność i sendy<br>→ MIKSER</div></aside>`:''}<div class="workspace" style="--accent:${colors[module]||'#d9bd86'}">${content}</div></div><div class="footer"><span><i class="led"></i>${source==='MIDI'?'MIDI 1 · C3 · velocity 100':source==='JAM'?'JAM · wspólna progresja':'SCENA: ZWROTKA · 8 TAKTÓW'}</span><span>OUT −12.4 dBFS</span><div class="spacer"></div><span class="prototype">PROTOTYP GUI · DO AKCEPTACJI · BEZ SILNIKA AUDIO</span><button onclick="go('diagnostics')">DIAGNOSTYKA</button></div>${key==='export-audio'?exportAudio:key==='export-midi'?exportMidi:extras[key]||''}</div>`;document.querySelectorAll('.advanced').forEach(el=>{if(module==='bass'){el.style.cursor='pointer';el.onclick=()=>go(key==='advanced'?'bass-generator':'advanced')}});document.querySelectorAll('.knob').forEach(k=>k.addEventListener('wheel',e=>{e.preventDefault();let out=k.parentElement.querySelector('output');out.textContent=e.deltaY<0?'↑ '+out.textContent.replace(/[↑↓] /,''):'↓ '+out.textContent.replace(/[↑↓] /,'')},{passive:false}));}
document.addEventListener('keydown',e=>{if(e.key==='Escape')go('arranger')});window.addEventListener('hashchange',render);render();</script></body></html>
